# API sayr-gorets наружу: https://gorets.sayr.info → 127.0.0.1:8790.
#
# Установка (от root, nginx и certbot уже стоят у сервера Sayr):
#   1. В DNS добавить запись A: gorets.sayr.info → IP этого VPS.
#   2. cp deploy/nginx-gorets.conf /etc/nginx/sites-available/gorets.sayr.info
#      ln -s /etc/nginx/sites-available/gorets.sayr.info /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx
#   3. certbot --nginx -d gorets.sayr.info     # выпустит сертификат и допишет HTTPS-блок
#   4. curl -s https://gorets.sayr.info/health
# Защита — токен в заголовке Authorization; без HTTPS не выставлять.
# Имя домена в двух местах ниже заменить на своё, если другое.

limit_req_zone $binary_remote_addr zone=gorets_api:1m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name gorets.sayr.info;

    # До выпуска сертификата здесь обычный HTTP; certbot добавит редирект на HTTPS.
    location / {
        limit_req zone=gorets_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }

    # Документацию и токен снаружи не светим: API отдаёт только JSON по токену,
    # /docs у приложения отключён.
    access_log /var/log/nginx/gorets.access.log;
    error_log /var/log/nginx/gorets.error.log;
}
