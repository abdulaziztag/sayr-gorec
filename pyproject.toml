[project]
name = "sayr-gorets"
version = "0.1.0"
description = "Сборщик сообщений форума «ГОРЕЦ» и недельный разбор ИИ для Sayr"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "telethon>=1.45,<2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "anthropic>=1.0",
    "ijson>=3.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[project.scripts]
gorets = "gorets.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gorets"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
